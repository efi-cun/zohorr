services:
  - type: web
    name: zoho-recruit-arena
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBLIC_WEB_URL
        value: https://zoho-recruit-arena.onrender.com
      - key: SUPABASE_URL
        value: https://dtrqnzbbcolnkcufjbhh.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
