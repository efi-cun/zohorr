<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zoho Recruit: Cyber-Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/cyber_theme.css">
</head>
<body class="flex flex-col items-center justify-center p-4">

  <!-- Background Cyber Elements -->
  <div class="fixed inset-0 pointer-events-none opacity-20 z-0">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500 rounded-full filter blur-[120px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-pink-500 rounded-full filter blur-[120px]"></div>
  </div>

  <main class="w-full max-w-md z-10 py-6">
    <!-- Header Logo / Title -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/40 text-cyan-400 text-xs font-semibold tracking-widest uppercase mb-2">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        Protocolo de Selección Cuántica
      </div>
      <h1 class="font-orbitron text-3xl font-extrabold tracking-wider text-white glow-cyan">
        ZOHO RECRUIT
      </h1>
      <p class="font-orbitron text-sm font-semibold tracking-widest text-cyan-400/90 uppercase">
        CYBER-TALENT ARENA
      </p>
    </div>

    <!-- Registration Card -->
    <div class="cyber-card p-6 md:p-8">
      <div class="flex items-center justify-between pb-4 border-b border-cyan-500/20 mb-6">
        <div class="flex items-center gap-2">
          <i data-lucide="shield-check" class="w-5 h-5 text-cyan-400"></i>
          <span class="font-orbitron text-xs tracking-wider text-slate-300">REGISTRO DE OPERADOR</span>
        </div>
        <span class="text-xs text-cyan-400 font-mono" id="systemStatus">ONLINE ● 2026</span>
      </div>

      <form id="joinForm" class="space-y-4">
        <!-- Room PIN -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Código de Sala / PIN
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="roomCode" 
              name="roomCode" 
              required 
              placeholder="EJ: ZR2026" 
              maxlength="10"
              class="w-full uppercase font-orbitron text-xl tracking-widest text-center bg-slate-900/90 border border-cyan-500/50 rounded-lg py-3 px-4 text-cyan-300 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition-all placeholder:text-slate-600"
            >
            <i data-lucide="key" class="w-4 h-4 text-cyan-500 absolute right-3 top-4"></i>
          </div>
        </div>

        <!-- Full Name -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Nombre Completo
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="fullName" 
              name="fullName" 
              required 
              placeholder="Tu nombre y apellido" 
              class="w-full bg-slate-900/90 border border-slate-700 rounded-lg py-2.5 px-4 text-slate-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500/30 transition-all placeholder:text-slate-600 text-sm"
            >
            <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute right-3 top-3"></i>
          </div>
        </div>

        <!-- Corporate Email -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Correo Institucional / Personal
          </label>
          <div class="relative">
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              placeholder="tu.correo@cun.edu.co" 
              class="w-full bg-slate-900/90 border border-slate-700 rounded-lg py-2.5 px-4 text-slate-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500/30 transition-all placeholder:text-slate-600 text-sm"
            >
            <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute right-3 top-3"></i>
          </div>
        </div>

        <!-- Role / Area -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Cargo o Área de Trabajo
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="roleArea" 
              name="roleArea" 
              placeholder="Ej: Talento Humano / Reclutamiento / CUN" 
              class="w-full bg-slate-900/90 border border-slate-700 rounded-lg py-2.5 px-4 text-slate-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500/30 transition-all placeholder:text-slate-600 text-sm"
            >
            <i data-lucide="briefcase" class="w-4 h-4 text-slate-500 absolute right-3 top-3"></i>
          </div>
        </div>

        <!-- Nickname -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            Nickname de Batalla (Alias en Pantalla)
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="nickname" 
              name="nickname" 
              required 
              maxlength="15"
              placeholder="Ej: Hunter_99, CybRecruiter" 
              class="w-full font-semibold bg-slate-900/90 border border-slate-700 rounded-lg py-2.5 px-4 text-cyan-300 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-500/30 transition-all placeholder:text-slate-600 text-sm"
            >
            <i data-lucide="crosshair" class="w-4 h-4 text-slate-500 absolute right-3 top-3"></i>
          </div>
        </div>

        <!-- Avatar Selection -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
            Selecciona tu Holograma / Avatar
          </label>
          <div class="grid grid-cols-4 gap-2" id="avatarGrid">
            <label class="cursor-pointer">
              <input type="radio" name="avatar" value="cyber_scout" checked class="hidden peer">
              <div class="p-2.5 rounded-lg border border-slate-700 bg-slate-900/80 flex flex-col items-center justify-center text-center peer-checked:border-cyan-400 peer-checked:bg-cyan-950/40 peer-checked:shadow-[0_0_15px_rgba(0,240,255,0.4)] transition-all">
                <span class="text-2xl mb-1">🤖</span>
                <span class="text-[10px] text-slate-300 font-mono">Scout</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="avatar" value="talent_hunter" class="hidden peer">
              <div class="p-2.5 rounded-lg border border-slate-700 bg-slate-900/80 flex flex-col items-center justify-center text-center peer-checked:border-pink-500 peer-checked:bg-pink-950/40 peer-checked:shadow-[0_0_15px_rgba(255,0,127,0.4)] transition-all">
                <span class="text-2xl mb-1">⚡</span>
                <span class="text-[10px] text-slate-300 font-mono">Hunter</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="avatar" value="quantum_ai" class="hidden peer">
              <div class="p-2.5 rounded-lg border border-slate-700 bg-slate-900/80 flex flex-col items-center justify-center text-center peer-checked:border-emerald-400 peer-checked:bg-emerald-950/40 peer-checked:shadow-[0_0_15px_rgba(0,255,157,0.4)] transition-all">
                <span class="text-2xl mb-1">🧠</span>
                <span class="text-[10px] text-slate-300 font-mono">Neural</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="avatar" value="matrix_scout" class="hidden peer">
              <div class="p-2.5 rounded-lg border border-slate-700 bg-slate-900/80 flex flex-col items-center justify-center text-center peer-checked:border-amber-400 peer-checked:bg-amber-950/40 peer-checked:shadow-[0_0_15px_rgba(255,184,0,0.4)] transition-all">
                <span class="text-2xl mb-1">🎯</span>
                <span class="text-[10px] text-slate-300 font-mono">Sniper</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full mt-4 font-orbitron py-3.5 px-6 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold tracking-wider uppercase text-sm shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all flex items-center justify-center gap-2 active:scale-95 cursor-pointer"
        >
          <i data-lucide="zap" class="w-4 h-4"></i>
          <span>CONECTAR A LA ARENA</span>
        </button>
      </form>
    </div>

    <!-- Host & Admin Links -->
    <div class="text-center mt-6 space-y-2">
      <div>
        <a 
          href="/host" 
          class="inline-flex items-center gap-2 text-xs font-mono text-cyan-400/80 hover:text-cyan-300 hover:underline transition-all"
        >
          <i data-lucide="projector" class="w-4 h-4"></i>
          <span>¿Eres el instructor? Ir a Consola de Misión (Host / Proyector)</span>
        </a>
      </div>
      <div>
        <a 
          href="/login" 
          class="inline-flex items-center gap-1.5 text-[11px] font-mono text-slate-400 hover:text-cyan-300 hover:underline transition-all"
        >
          <i data-lucide="shield" class="w-3.5 h-3.5 text-cyan-400"></i>
          <span>Portal de Facilitadores & Administrador (Crear y Editar Evaluaciones)</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // Auto-fill PIN if in URL query ?pin=XXXXXX
    const urlParams = new URLSearchParams(window.location.search);
    const pinParam = urlParams.get('pin');
    if (pinParam) {
      document.getElementById('roomCode').value = pinParam.toUpperCase();
    }

    const form = document.getElementById('joinForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="inline-block animate-spin mr-2">⚙️</span>
        SINCRONIZANDO CON SUPABASE...
      `;

      const formData = new FormData(form);
      const payload = {
        room_code: formData.get('roomCode').toUpperCase().trim(),
        full_name: formData.get('fullName').trim(),
        email: formData.get('email').trim(),
        role_or_area: formData.get('roleArea').trim(),
        nickname: formData.get('nickname').trim(),
        avatar: formData.get('avatar')
      };

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Error en el registro');
        }

        // Store player state in sessionStorage
        sessionStorage.setItem('cyber_player', JSON.stringify({
          id: data.player_id,
          room_code: data.room_code,
          nickname: payload.nickname,
          avatar: payload.avatar,
          full_name: payload.full_name
        }));

        // Redirect to player arena
        window.location.href = `/play?pin=${data.room_code}&id=${data.player_id}`;

      } catch (err) {
        alert("Error: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i><span>CONECTAR A LA ARENA</span>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
