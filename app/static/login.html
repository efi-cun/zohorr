<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Facilitadores & Administrador | Cyber-Talent Arena</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .cyber-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.35);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.15);
    }
  </style>
</head>
<body class="min-h-full flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-cyan-950 border border-cyan-500/50 shadow-[0_0_25px_rgba(0,240,255,0.4)] mb-3">
        <i data-lucide="shield-check" class="w-8 h-8 text-cyan-400"></i>
      </div>
      <h1 class="font-orbitron text-2xl font-bold tracking-wider text-white">
        ACCESO <span class="text-cyan-400">GESTIÓN</span>
      </h1>
      <p class="text-xs text-slate-400 font-mono tracking-widest mt-1">
        PORTAL DE ADMINISTRADORES & FACILITADORES ● CUN
      </p>
    </div>

    <!-- Login Card -->
    <div class="cyber-card rounded-2xl p-6 sm:p-8">
      <form id="loginForm" class="space-y-4">
        
        <div>
          <label class="block text-xs font-orbitron text-cyan-300 tracking-wider mb-1.5" for="username">
            USUARIO O CORREO
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input 
              type="text" 
              id="username" 
              name="username" 
              required
              autocomplete="username"
              placeholder="ej. admin o facilitador"
              class="w-full bg-slate-900/90 border border-slate-700 focus:border-cyan-400 rounded-lg py-2.5 pl-10 pr-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-mono transition-all"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-orbitron text-cyan-300 tracking-wider mb-1.5" for="password">
            CONTRASEÑA
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
              <i data-lucide="key" class="w-4 h-4"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              autocomplete="current-password"
              placeholder="••••••••••••"
              class="w-full bg-slate-900/90 border border-slate-700 focus:border-cyan-400 rounded-lg py-2.5 pl-10 pr-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-400 font-mono transition-all"
            >
          </div>
        </div>

        <div id="errorAlert" class="hidden p-3 rounded-lg bg-red-950/80 border border-red-500/50 text-red-300 text-xs font-mono flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-red-400"></i>
          <span id="errorMsg">Credenciales inválidas</span>
        </div>

        <button 
          type="submit" 
          id="loginSubmitBtn"
          class="w-full mt-2 font-orbitron py-3 px-4 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold tracking-wider uppercase text-xs shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all flex items-center justify-center gap-2 active:scale-95 cursor-pointer"
        >
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>INGRESAR AL PANEL</span>
        </button>
      </form>
    </div>

    <!-- Back Link -->
    <div class="text-center mt-6">
      <a href="/" class="inline-flex items-center gap-2 text-xs font-mono text-cyan-400 hover:underline">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Volver al lobby de participantes</span>
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="inline-block animate-spin mr-2">⚙️</span> AUTENTICANDO...`;

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Credenciales inválidas');
        }

        // Store session
        localStorage.setItem('arena_token', data.token);
        localStorage.setItem('arena_user', JSON.stringify(data.user));

        // Redirect to dashboard
        window.location.href = '/admin';

      } catch (err) {
        errorMsg.innerText = err.message;
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>INGRESAR AL PANEL</span>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
